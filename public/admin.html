<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Área da loja · Mari Gourmet</title><link rel="stylesheet" href="/style.css">
<style>.o{background:#fff;border-left:12px solid;border-radius:14px;padding:14px;margin:12px 0;box-shadow:0 1px 5px #0002}
.o.s-aguardando{border-color:#e6b800}.o.s-pago{border-color:#2e9d57}.o.s-preparo{border-color:#2f7de1}.o.s-pronto{border-color:#8e44ad}.o.s-entregue{border-color:#7f8c8d;opacity:.7}.o.s-cancelado{border-color:#d63031;opacity:.7}
.o .big{margin-top:10px;height:64px;font-size:20px}.ch{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.ch button{border:0;border-radius:99px;padding:10px 12px;color:#fff;font-weight:700;font-size:14px;opacity:.55}.ch button.on{opacity:1;outline:3px solid #000}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}</style></head><body>
<header><div class="row"><h1>Área da loja</h1><button id="out" class="hide" style="border:0;background:none;color:#888">Sair</button></div></header>
<main><div id="login" class="sheet"><h2>Entrar</h2><input type="password" id="pw" placeholder="Senha"><div class="err" id="er"></div><button class="btn" id="in">Entrar</button></div>
<div id="list" class="hide"><div id="sum" style="font-weight:700;margin-top:8px"></div><div id="os"></div></div></main>
<script>
const $=s=>document.querySelector(s),brl=c=>(c/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const ST={aguardando:'Aguardando pagamento',pago:'Pago',preparo:'Em preparação',pronto:'Pronto p/ retirada',entregue:'Entregue',cancelado:'Cancelado'};
const NEXT={aguardando:['pago','✅ Confirmar pagamento'],pago:['preparo','👩‍🍳 Começar a preparar'],preparo:['pronto','📦 Marcar como PRONTO'],pronto:['entregue','🤝 Entregue ao cliente']};
const COL={aguardando:'#e6b800',pago:'#2e9d57',preparo:'#2f7de1',pronto:'#8e44ad',entregue:'#7f8c8d',cancelado:'#d63031'};
let tk=localStorage.getItem('adm'),seen=0,first=true;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=(p,o={})=>fetch(p,{...o,headers:{'Content-Type':'application/json',Authorization:'Bearer '+tk}});
function beep(){try{const c=new AudioContext(),o=c.createOscillator();o.connect(c.destination);o.frequency.value=880;o.start();setTimeout(()=>{o.stop();c.close()},350)}catch{}}
async function load(){const r=await api('/api/admin/orders').catch(()=>null);if(!r)return;
  if(r.status===401){tk=null;localStorage.removeItem('adm');return show()}
  const os=await r.json(),max=os.length?os[os.length-1].id:0;if(!first&&max>seen)beep();seen=max;first=false;
  const open=os.filter(o=>!['entregue','cancelado'].includes(o.status)).length;
  $('#sum').textContent=`${os.length} pedido(s) hoje · ${open} em andamento`;
  $('#os').innerHTML=os.map(o=>{const n=NEXT[o.status];return `<div class="o s-${o.status}"><div class="row"><b style="font-size:22px">#${o.id} · ${esc(o.name)}</b><span class="st s-${o.status}">${ST[o.status]}</span></div>
  <div>Sala: <b>${esc(o.room)}</b> · ${new Date(o.created_at).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</div>
  <div style="margin:8px 0">${o.items.map(i=>`<div style="font-size:19px"><b>${i.qty}×</b> ${esc(i.name)}</div>`).join('')}</div>
  <div class="row"><b style="font-size:20px">${brl(o.total_cents)}</b><b>${o.payment==='pix'?'PIX':'💳 Cartão (presencial)'}</b></div>
  ${n?`<button class="btn big" style="background:${COL[n[0]]}" data-id="${o.id}" data-s="${n[0]}">${n[1]}</button>`:''}
  <div class="ch">${Object.keys(ST).map(s=>`<button class="${s===o.status?'on':''}" style="background:${COL[s]}" data-id="${o.id}" data-s="${s}">${ST[s]}</button>`).join('')}</div></div>`}).join('')||'<p style="margin:20px">Nenhum pedido hoje ainda.</p>'}
document.addEventListener('click',async e=>{const t=e.target;
  if(t.dataset.s){if(t.dataset.s==='cancelado'&&!confirm('Cancelar este pedido?'))return;t.disabled=true;await api(`/api/admin/orders/${t.dataset.id}/status`,{method:'PATCH',body:JSON.stringify({status:t.dataset.s})});load()}
  if(t.id==='out'){localStorage.removeItem('adm');tk=null;show()}
  if(t.id==='in'){const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('#pw').value})});const d=await r.json();
    if(!r.ok)return $('#er').textContent=d.error;tk=d.token;localStorage.setItem('adm',tk);show()}});
function show(){const on=!!tk;$('#login').classList.toggle('hide',on);$('#list').classList.toggle('hide',!on);$('#out').classList.toggle('hide',!on);if(on){first=true;load()}}
setInterval(()=>tk&&load(),5000);show();
</script></body></html>
